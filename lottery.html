<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>카드 뽑기</title>
<style>
:root{--bg:#0b0718;--text:#f4f2ff;--muted:#aaa3cc;--line:rgba(255,255,255,.14);--gold:#fbbf24}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1200px 700px at 50% -10%,#3b1d6e 0%,var(--bg) 62%);background-color:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;min-height:100vh;padding:16px 14px 40px;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.wrap{max-width:1240px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
header a{color:var(--muted);text-decoration:none;font-size:14px;font-weight:700;padding:6px 12px;border:1px solid var(--line);border-radius:999px}
h1{margin:0;font-size:clamp(26px,3.4vw,42px);font-weight:900;background:linear-gradient(90deg,#fde68a,#fff,#f9a8d4,#a5f3fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.snd{margin-left:auto;font-family:inherit;font-size:14px;font-weight:800;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--text);cursor:pointer}
/* 설정 */
.setup{margin:4px 0 14px;padding:14px 16px;border-radius:18px;border:1px solid rgba(251,191,36,.55);background:rgba(251,191,36,.08)}
.setup summary{cursor:pointer;font-size:17px;font-weight:900;color:#fde68a;list-style:none}
.setup summary::-webkit-details-marker{display:none}
.setup .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-top:12px}
.setup label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:800}
.setup input[type=number]{width:110px;font-family:inherit;font-size:24px;font-weight:900;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.45);color:#fff;text-align:center}
.setup textarea{width:min(560px,100%);min-height:70px;font-family:inherit;font-size:15px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.45);color:#fff;resize:vertical}
.setup .hint{font-size:12px;color:var(--muted);font-weight:600}
.btn{font-family:inherit;font-size:16px;font-weight:900;padding:12px 18px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--text);cursor:pointer}
.btn.gold{background:linear-gradient(90deg,#fde68a,#fbbf24,#f59e0b);color:#2b1600;border:0;box-shadow:0 6px 22px rgba(251,191,36,.35)}
.qr{display:flex;gap:14px;align-items:center;margin-top:12px}
.qr #qr{padding:8px;background:#fff;border-radius:10px;line-height:0}
.qr #qr img,.qr #qr canvas{width:140px!important;height:140px!important}
.qr .u{font-size:13px;color:#fde68a;word-break:break-all}
/* 상태 */
.stat{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.stat span{padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:15px;font-weight:800}
.stat b{color:#fde68a}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-size:15px;font-weight:800}
.who input,.who select{min-width:0;font-family:inherit;font-size:16px;font-weight:800;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.45);color:#fff;outline:none}
.who select{border-color:rgba(165,243,252,.6)}
.mine{min-height:22px;font-size:15px;font-weight:800;color:#a5f3fc;margin-bottom:10px}
/* 카드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw,96px),1fr));gap:12px;perspective:1000px}
.card{position:relative;aspect-ratio:3/4;border:0;padding:0;background:none;cursor:pointer;font-family:inherit;touch-action:manipulation}
.card .in{position:absolute;inset:0;transition:transform .8s cubic-bezier(.3,1.5,.5,1);transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;text-align:center;overflow:hidden}
.card .f{background:linear-gradient(145deg,#6d28d9,#db2777);border:2px solid rgba(255,255,255,.35);box-shadow:0 6px 18px rgba(0,0,0,.45);color:#fff}
.card .f::after{content:"";position:absolute;inset:7px;border-radius:9px;border:1.5px dashed rgba(255,255,255,.35)}
.card .f .q{font-size:clamp(26px,3vw,42px);font-weight:900}
.card .f .n{font-size:13px;font-weight:800;opacity:.85}
.card .b{transform:rotateY(180deg);background:#1e1838;border:2px solid var(--line)}
.card .b .ic{font-size:clamp(22px,3vw,40px)}
.card .b .r{font-size:clamp(16px,2vw,24px);font-weight:900}
.card .b .w{font-size:12px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.win .b{background:linear-gradient(145deg,#fff3c4,#fbbf24 45%,#d97706);border-color:#fff7d6;color:#2b1600;box-shadow:0 0 30px rgba(251,191,36,.85),inset 0 0 18px rgba(255,255,255,.6)}
.card.win .b::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0 10%,rgba(255,255,255,.55) 12%,transparent 16% 40%,rgba(255,255,255,.4) 42%,transparent 46%);animation:spin 4s linear infinite}
.card.win .b>*{position:relative}
.card.win .b .w{color:#5a3a00;font-weight:800}
.card.lose .b{color:#c9c2e6}
.card:not(.flip):not(:disabled):hover .f{transform:translateY(-4px);filter:brightness(1.15)}
.card:disabled{cursor:default}
.card.locked:not(.flip) .f{filter:saturate(.35) brightness(.7)}
.card.mine-card .b{outline:3px solid #a5f3fc;outline-offset:2px}
.card.shake .in{animation:shake .7s}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg) scale(1.05)}40%{transform:rotate(6deg) scale(1.08)}60%{transform:rotate(-4deg) scale(1.06)}80%{transform:rotate(3deg) scale(1.04)}}
@keyframes spin{to{transform:rotate(360deg)}}
/* 당첨 연출 */
#cele{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;background:radial-gradient(circle at 50% 50%,rgba(120,60,0,.55),rgba(8,4,20,.94) 70%)}
#cele.show{display:flex}
#cele .rays{position:absolute;width:260vmax;height:260vmax;left:50%;top:50%;margin:-130vmax 0 0 -130vmax;background:repeating-conic-gradient(from 0deg,rgba(255,214,102,.28) 0 6deg,transparent 6deg 18deg);animation:spin 14s linear infinite;mask:radial-gradient(circle,#000 0,transparent 60%);-webkit-mask:radial-gradient(circle,#000 0,transparent 60%)}
#cele .flash{position:absolute;inset:0;background:#fff7d6;animation:flash 1s ease-out forwards;pointer-events:none}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
#cele .big{position:relative;width:min(62vmin,380px);aspect-ratio:3/4;border-radius:26px;background:linear-gradient(145deg,#fff8d6,#fcd34d 40%,#f59e0b 75%,#b45309);border:4px solid #fffbe8;box-shadow:0 0 80px rgba(251,191,36,.95),0 0 160px rgba(251,191,36,.55),inset 0 0 40px rgba(255,255,255,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#3b1d00;text-align:center;overflow:hidden;animation:bigin 1.1s cubic-bezier(.2,1.6,.4,1) both}
#cele .big::before{content:"";position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent 0 8%,rgba(255,255,255,.7) 10%,transparent 14% 45%,rgba(255,255,255,.55) 47%,transparent 51%);animation:spin 3s linear infinite}
#cele .big>*{position:relative}
#cele .tr{font-size:min(17vmin,110px);line-height:1;animation:blow .45s ease-in-out infinite alternate}
#cele .t{font-size:min(14vmin,92px);font-weight:900;letter-spacing:.04em;text-shadow:0 3px 0 #fff3c4,0 0 24px rgba(255,255,255,.9)}
#cele .nm{font-size:min(6.5vmin,38px);font-weight:900}
#cele .no{font-size:min(4vmin,20px);font-weight:800;opacity:.8}
#cele .side{position:absolute;top:50%;font-size:min(22vmin,170px);animation:blow .4s ease-in-out infinite alternate}
#cele .side.l{left:4vw;transform:translateY(-50%) scaleX(-1)}
#cele .side.r{right:4vw;transform:translateY(-50%)}
#cele .cap{position:relative;margin-top:22px;font-size:clamp(20px,3vw,34px);font-weight:900;color:#fde68a;text-shadow:0 0 18px rgba(251,191,36,.9);animation:pulse 1s ease-in-out infinite}
#cele .close{position:absolute;bottom:22px;font-family:inherit;font-size:16px;font-weight:900;padding:10px 26px;border-radius:999px;border:0;background:rgba(255,255,255,.92);color:#1a1033;cursor:pointer}
@keyframes bigin{0%{transform:scale(.1) rotateY(540deg);opacity:0}60%{transform:scale(1.12) rotateY(0)}100%{transform:scale(1)}}
@keyframes blow{from{transform:translateY(-50%) rotate(-8deg) scale(1)}to{transform:translateY(-50%) rotate(6deg) scale(1.12)}}
#cele .tr{transform-origin:50% 60%}
#cele .big .tr{animation:blow2 .45s ease-in-out infinite alternate}
@keyframes blow2{from{transform:rotate(-10deg) scale(1)}to{transform:rotate(8deg) scale(1.15)}}
#cele .side.l{animation:blowl .4s ease-in-out infinite alternate}
@keyframes blowl{from{transform:translateY(-50%) scaleX(-1) rotate(-8deg)}to{transform:translateY(-50%) scaleX(-1) rotate(6deg) scale(1.12)}}
@keyframes pulse{50%{transform:scale(1.08)}}
#lose{position:fixed;inset:0;z-index:45;display:none;align-items:center;justify-content:center;flex-direction:column;gap:6px;background:rgba(8,4,20,.75);text-align:center}
#lose.show{display:flex}
#lose .e{font-size:96px;animation:droop 1.6s ease-in-out}
#lose .t{font-size:clamp(40px,8vw,80px);font-weight:900;color:#c9c2e6}
#lose .s{font-size:17px;color:#e9e4ff}
@keyframes droop{0%{transform:scale(.3)}40%{transform:scale(1.1)}100%{transform:scale(1) rotate(-8deg) translateY(10px)}}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f1640;border:1px solid var(--line);padding:10px 18px;border-radius:999px;font-weight:800;font-size:14px;opacity:0;transition:opacity .3s;z-index:70;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media(max-width:600px){.grid{--cw:64px!important;gap:8px}.card .f .n{font-size:11px}.card .b .w{font-size:10px}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <header><a href="/">← 처음으로</a><h1>🎺 카드 뽑기</h1><button class="snd" id="snd" type="button">🔊 소리 켜짐</button></header>
  <div id="setupBox"></div>
  <div class="stat" id="stat"></div>
  <div class="who" id="whoBox"></div>
  <div class="mine" id="mine"></div>
  <div class="grid" id="grid"></div>
</div>
<div id="cele"></div>
<div id="lose"></div>
<div class="toast" id="toast"></div>
<script>
(()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
// 진행자 큰 화면(노트북·빔프로젝터) = 넓은 화면 또는 주소에 ?host. 설정 칸은 여기서만 보이고, 여러 사람이 차례로 뽑을 수 있다
const HOST=innerWidth>=900||/[?&]host\b/.test(location.search);
let L=null,busy=false,lastGrid='',seen=null,myOpen=null,soundOn=LS.get('lottery-sound')!=='0';
const myKey=()=>L?'lottery-pick-r'+L.round:'';
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.remove('show'),2600)}

/* ---------- 소리: 트럼펫 팡파르 · 드럼롤 · 꽝 트롬본 (Web Audio 로 직접 합성) ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
addEventListener('pointerdown',()=>ac(),{passive:true});
function brass(f,t0,dur,vol=.22){
  const a=ac();if(!a||!soundOn)return;const t=a.currentTime+t0;
  const g=a.createGain(),lp=a.createBiquadFilter();lp.type='lowpass';lp.Q.value=4;
  lp.frequency.setValueAtTime(700,t);lp.frequency.linearRampToValueAtTime(3800,t+.06);lp.frequency.exponentialRampToValueAtTime(1800,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.03);g.gain.setValueAtTime(vol*.85,t+dur*.7);g.gain.exponentialRampToValueAtTime(.0005,t+dur+.12);
  const lfo=a.createOscillator(),lg=a.createGain();lfo.frequency.value=5.6;lg.gain.value=dur>.4?f*.012:0;lfo.connect(lg);
  [0,-6,7].forEach(dt=>{const o=a.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=dt;lg.connect(o.frequency);o.connect(lp);o.start(t);o.stop(t+dur+.15)});
  lfo.start(t);lfo.stop(t+dur+.15);lp.connect(g);g.connect(a.destination);
}
function noise(t0,dur,vol){const a=ac();if(!a||!soundOn)return;const t=a.currentTime+t0,len=Math.floor(a.sampleRate*dur),buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);const s=a.createBufferSource(),g=a.createGain(),bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1800;
  s.buffer=buf;g.gain.value=vol;s.connect(bp);bp.connect(g);g.connect(a.destination);s.start(t)}
function drumroll(sec){for(let t=0;t<sec;t+=.045)noise(t,.06,.18+.5*t/sec);noise(sec,.5,.9)}
const N=n=>440*Math.pow(2,(n-69)/12);
function fanfare(t0=0){ // 따다다 따~ 따다 따아~ (C장조 팡파르)
  const q=.13;[[67,0,q],[67,q,q],[67,2*q,q],[72,3*q,.55],[67,3*q+.6,q],[72,3*q+.6+q,q],[76,3*q+.6+2*q,.9]].forEach(([m,t,d])=>{brass(N(m),t0+t,d);brass(N(m-12),t0+t,d,.12)});
  const t2=t0+3*q+.6+2*q+1.0;[[72,0,q],[76,q,q],[79,2*q,q],[84,3*q,1.3]].forEach(([m,t,d])=>{brass(N(m),t2+t,d,.24);brass(N(m-7),t2+t,d,.12);brass(N(m-12),t2+t,d,.12)});
  for(let k=0;k<6;k++)noise(t2+3*q+k*.18,.25,.5);
}
function sadTrombone(){[[58,0,.38],[57,.4,.38],[56,.8,.38],[55,1.2,1.1]].forEach(([m,t,d])=>brass(N(m-12),t,d,.2))}
$('#snd').textContent=soundOn?'🔊 소리 켜짐':'🔇 소리 꺼짐';
$('#snd').addEventListener('click',()=>{soundOn=!soundOn;LS.set('lottery-sound',soundOn?'1':'0');$('#snd').textContent=soundOn?'🔊 소리 켜짐':'🔇 소리 꺼짐';if(soundOn){ac();brass(N(72),0,.25)}});

/* ---------- 효과: 색종이 · 불꽃 · 이모지 ---------- */
const fx=(()=>{const c=$('#fx'),x=c.getContext('2d');let P=[],run=false;const COLS=['#fde68a','#fbbf24','#f59e0b','#f472b6','#a5f3fc','#86efac','#fff','#c4b5fd'];
  function size(){c.width=innerWidth;c.height=innerHeight}size();addEventListener('resize',size);
  function loop(){x.clearRect(0,0,c.width,c.height);P=P.filter(p=>p.l>0);
    for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=p.dr;p.l--;p.r+=p.vr;x.globalAlpha=Math.min(1,p.l/40);
      if(p.e){x.font=p.s+'px serif';x.fillText(p.e,p.x,p.y)}else if(p.spark){x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.s,0,7);x.fill()}
      else{x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()}}
    x.globalAlpha=1;if(P.length)requestAnimationFrame(loop);else run=false}
  const go=()=>{if(!run){run=true;loop()}};
  return{
    cannon(n){for(let i=0;i<n;i++){const left=i%2===0;P.push({x:left?0:innerWidth,y:innerHeight*.85,vx:(left?1:-1)*(6+Math.random()*12),vy:-(12+Math.random()*12),g:.32,dr:.99,s:8+Math.random()*10,c:COLS[i%COLS.length],l:150+Math.random()*80,r:Math.random()*6,vr:(Math.random()-.5)*.4})}go()},
    rain(n){for(let i=0;i<n;i++)P.push({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.6,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,g:.05,dr:1,s:7+Math.random()*9,c:COLS[i%COLS.length],l:220+Math.random()*80,r:Math.random()*6,vr:(Math.random()-.5)*.3});go()},
    firework(x0,y0){const col=COLS[(Math.random()*COLS.length)|0];for(let i=0;i<70;i++){const a=Math.PI*2*i/70,sp=3+Math.random()*5;P.push({x:x0,y:y0,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:.06,dr:.97,s:2+Math.random()*2.5,c:col,l:60+Math.random()*40,spark:1,r:0,vr:0})}go()},
    emoji(list,n){for(let i=0;i<n;i++)P.push({x:Math.random()*innerWidth,y:innerHeight+30,vx:(Math.random()-.5)*3,vy:-(8+Math.random()*9),g:.16,dr:1,s:30+Math.random()*30,e:list[i%list.length],l:150,r:0,vr:0});go()}
  };
})();

/* ---------- 당첨 · 꽝 연출 ---------- */
let celeQ=[],celeOn=false;
function celebrate(i,who){celeQ.push({i,who});if(!celeOn)nextCele()}
function nextCele(){
  const c=celeQ.shift();if(!c){celeOn=false;return}celeOn=true;
  const el=$('#cele');
  el.innerHTML=`<div class="rays"></div><div class="flash"></div><div class="side l">🎺</div><div class="side r">🎺</div>
    <div class="big"><div class="tr">🎺</div><div class="t">당첨!</div>${c.who?`<div class="nm">${esc(c.who)}</div>`:''}<div class="no">${c.i+1}번 카드</div></div>
    <div class="cap">🎉 축하합니다! 🎉</div><button class="close" type="button" id="celeX">닫기</button>`;
  el.classList.add('show');
  fanfare(.15);fx.cannon(260);setTimeout(()=>fx.cannon(200),700);setTimeout(()=>fx.rain(260),300);fx.emoji(['🎺','🎉','✨','🏆','💛'],40);
  for(let k=0;k<12;k++)setTimeout(()=>fx.firework(innerWidth*(.15+Math.random()*.7),innerHeight*(.12+Math.random()*.45)),400+k*420);
  setTimeout(()=>fx.emoji(['🎺','🎊','⭐'],30),2200);
  if(navigator.vibrate)navigator.vibrate([150,80,150,80,400]);
  clearTimeout(nextCele.h);nextCele.h=setTimeout(closeCele,9000);
}
function closeCele(){clearTimeout(nextCele.h);$('#cele').classList.remove('show');$('#cele').innerHTML='';setTimeout(nextCele,250)}
function showLose(i,who){
  const el=$('#lose');el.innerHTML=`<div class="e">😅</div><div class="t">꽝</div><div class="s">${who?esc(who)+' · ':''}${i+1}번 카드 — 다음 기회에!</div>`;
  el.classList.add('show');sadTrombone();if(navigator.vibrate)navigator.vibrate(80);
  clearTimeout(showLose.h);showLose.h=setTimeout(()=>el.classList.remove('show'),2600);
}
$('#lose').addEventListener('click',()=>$('#lose').classList.remove('show'));
document.addEventListener('click',e=>{if(e.target.id==='celeX')closeCele()});

/* ---------- 화면 ---------- */
function renderSetup(){
  const box=$('#setupBox');if(!HOST){box.innerHTML='';return}
  if(box.dataset.r===String(L.round))return;box.dataset.r=String(L.round);
  box.innerHTML=`<details class="setup" ${L.openedCount===0?'open':''}><summary>⚙ 게임 설정 — 참여 인원 · 당첨 인원 (지금: ${L.total}명 중 ${L.winners}명 당첨${L.names.length?' · 명단 '+L.names.length+'명':''})</summary>
    <div class="row">
      <label>참여 인원<input id="sTotal" type="number" min="1" max="100" value="${L.total}"></label>
      <label>당첨 인원<input id="sWin" type="number" min="0" max="100" value="${L.winners}"></label>
      <label style="flex:1">참여자 이름 <span class="hint">(선택) 줄바꿈이나 쉼표로 구분 · 적으면 참여 인원은 명단 수로 자동, 한 사람 한 장만</span>
        <textarea id="sNames" placeholder="예) 참가자01, 참가자02, 참가자03">${esc(L.names.join('\n'))}</textarea></label>
    </div>
    <div class="row">
      <button class="btn gold" id="sGo" type="button">🔀 카드 섞고 시작</button>
      <button class="btn" id="sReveal" type="button">남은 카드 모두 공개</button>
      <button class="btn" id="sQr" type="button">📱 휴대폰 QR</button>
      <button class="btn" id="sTest" type="button">🎺 당첨 연출 미리보기</button>
    </div>
    <div class="qr" id="qrWrap" hidden><div id="qr"></div><div class="u" id="qrUrl"></div></div></details>`;
  $('#sNames').addEventListener('input',e=>{const n=e.target.value.split(/[\n,]+/).map(x=>x.trim()).filter(Boolean);if(n.length)$('#sTotal').value=new Set(n).size});
}
function renderWho(){
  const box=$('#whoBox');
  const sig=JSON.stringify([L.round,L.names,L.drawn]);if(box.dataset.s===sig)return;box.dataset.s=sig;
  const prev=(box.querySelector('select,input')||{}).value||LS.get('lottery-who')||'';
  if(L.names.length){
    const left=L.names.filter(n=>!L.drawn.includes(n));
    box.innerHTML=`👤 뽑을 사람 <select id="who"><option value="">— 내 이름 고르기 —</option>${left.map(n=>`<option${n===prev?' selected':''}>${esc(n)}</option>`).join('')}</select><span style="color:var(--muted);font-size:13px">남은 사람 ${left.length}명</span>`;
  }else box.innerHTML=`👤 내 이름 <input id="who" maxlength="20" placeholder="(선택) 카드에 같이 표시" value="${esc(prev)}">`;
  const w=$('#who');w.addEventListener('change',()=>LS.set('lottery-who',w.value.trim()||null));w.addEventListener('input',()=>LS.set('lottery-who',w.value.trim()||null));
}
function render(){
  if(!L)return;
  renderSetup();renderWho();
  const mine=HOST?null:LS.get(myKey());
  $('#stat').innerHTML=`<span>참여 <b>${L.total}</b>명</span><span>🎺 당첨 <b>${L.winners}</b>명</span><span>남은 당첨 <b>${L.winnersLeft}</b></span><span>뽑은 카드 <b>${L.openedCount}</b> / ${L.total}</span>`;
  const mc=mine!=null?L.cards[+mine]:null;
  $('#mine').textContent=L.openedCount>=L.total?'카드를 모두 뽑았어요!':mc&&mc.opened?`내 카드: ${+mine+1}번 · ${mc.win?'🎺 당첨!':'꽝'}`:HOST?'진행자 화면: 한 사람씩 나와서 카드를 눌러 뽑아요':'카드를 한 장 골라 눌러 보세요!';
  const locked=mine!=null;
  const sig=JSON.stringify([L.round,L.cards,locked,mine]);
  if(sig!==lastGrid){lastGrid=sig;
    $('#grid').style.setProperty('--cw',L.total<=8?'170px':L.total<=16?'130px':L.total<=30?'108px':'84px');
    $('#grid').innerHTML=L.cards.map(c=>`<button class="card${c.opened?' flip '+(c.win?'win':'lose'):''}${locked?' locked':''}${mine!=null&&+mine===c.i?' mine-card':''}" data-i="${c.i}" type="button"${c.opened||locked?' disabled':''}>
      <div class="in"><div class="f"><div class="q">?</div><div class="n">${c.i+1}</div></div>
      <div class="b"><div class="ic">${c.opened?(c.win?'🎺':'😅'):''}</div><div class="r">${c.opened?(c.win?'당첨!':'꽝'):''}</div><div class="w">${esc(c.who||(c.i+1)+'번')}</div></div></div></button>`).join('');
  }
}
// 다른 기기(휴대폰)에서 뽑은 당첨도 큰 화면에서 같이 축하
function detect(){
  if(!L)return;const now=new Map(L.cards.filter(c=>c.opened).map(c=>[c.i,c]));
  if(HOST&&seen&&seen.round===L.round)for(const [i,c] of now)if(!seen.set.has(i)&&i!==myOpen&&c.win)celebrate(i,c.who);
  seen={round:L.round,set:new Set(now.keys())};
}
async function load(){
  try{const r=await fetch('/api/lottery',{cache:'no-store'});L=await r.json();detect();render()}catch(e){$('#stat').innerHTML='<span>서버 연결 중…</span>'}
}
async function post(body){
  const r=await fetch('/api/lottery',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'다시 시도해 주세요');if(j.l){L=j.l}return j;
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
document.addEventListener('click',async e=>{
  const c=e.target.closest('.card');
  if(c&&!c.disabled&&!busy&&L){
    const i=+c.dataset.i,who=($('#who')||{}).value?.trim()||'';
    if(L.names.length&&!who){toast('먼저 위에서 뽑을 사람 이름을 골라 주세요');$('#who').focus();return}
    if(!confirm(`${who?who+'님, ':''}${i+1}번 카드를 뽑을까요?`))return;
    busy=true;ac();myOpen=i;
    c.classList.add('shake');drumroll(.75);await wait(800);
    try{const j=await post({action:'open',idx:i,round:L.round,who});
      if(!HOST)LS.set(myKey(),String(i));
      detect();lastGrid='';render();
      if(j.win)celebrate(i,who);else showLose(i,who);
      if(HOST&&L.names.length){const w=$('#who');if(w)w.value=''}
    }catch(err){toast(err.message);c.classList.remove('shake');load()}
    busy=false;return;
  }
  if(e.target.id==='sGo'){
    const names=$('#sNames').value,total=+$('#sTotal').value,winners=+$('#sWin').value;
    const nn=names.split(/[\n,]+/).map(x=>x.trim()).filter(Boolean);const tot=nn.length?new Set(nn).size:total;
    if(!confirm(`참여 ${tot}명 중 ${winners}명 당첨으로 카드를 새로 섞을까요?\n지금까지 뽑은 카드는 모두 지워져요.`))return;
    try{const j=await post({action:'setup',total,winners,names});toast(j.msg);lastGrid='';$('#setupBox').dataset.r='';$('#whoBox').dataset.s='';seen=null;detect();render();
      const d=$('#setupBox details');if(d)d.open=false}catch(err){toast(err.message)}return;
  }
  if(e.target.id==='sReveal'){if(!confirm('아직 안 뽑은 카드를 모두 공개할까요?'))return;try{const j=await post({action:'reveal'});seen={round:L.round,set:new Set(L.cards.map(c=>c.i))};toast(j.msg);lastGrid='';render()}catch(err){toast(err.message)}return}
  if(e.target.id==='sTest'){ac();celebrate(0,'미리보기');return}
  if(e.target.id==='sQr'){const w=$('#qrWrap');w.hidden=!w.hidden;if(!w.hidden)drawQr();return}
});
async function drawQr(){
  let url=location.origin+'/lottery';
  try{const j=await (await fetch('/api/info',{cache:'no-store'})).json();const u=j.public||(location.hostname==='localhost'&&j.urls&&j.urls[0])||location.origin+'/';url=u.replace(/\/$/,'')+'/lottery'}catch(e){}
  $('#qrUrl').textContent=url;
  if(!window.QRCode)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)}).catch(()=>{});
  if(window.QRCode){$('#qr').innerHTML='';new QRCode($('#qr'),{text:url,width:300,height:300,correctLevel:QRCode.CorrectLevel.M})}
}
load();setInterval(()=>{if(!busy)load()},1200);
})();
</script>
</body>
</html>
