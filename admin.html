<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>관리자 화면</title>
<style>
:root{--bg:#0b0718;--text:#f4f2ff;--muted:#aaa3cc;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
/* 로그인 */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(900px 500px at 50% 0,#3b1d6e,var(--bg) 70%)}
.login form{width:min(92vw,380px);padding:28px 24px;border-radius:24px;background:rgba(255,255,255,.05);border:1px solid var(--line);text-align:center}
.login h1{margin:0 0 6px;font-size:26px}
.login p{margin:0 0 18px;color:var(--muted);font-size:14px}
.login input{width:100%;font-family:inherit;font-size:28px;font-weight:900;letter-spacing:.4em;text-align:center;padding:12px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.45);color:#fff;outline:none}
.login button{width:100%;margin-top:12px;font-family:inherit;font-size:18px;font-weight:900;padding:13px;border-radius:14px;border:0;background:linear-gradient(90deg,#fde68a,#fbbf24);color:#2b1600;cursor:pointer}
.login .err{min-height:20px;margin-top:10px;color:#fca5a5;font-weight:800;font-size:14px}
.login .shake{animation:shk .4s}
@keyframes shk{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
/* 대시보드 */
.dash{display:none;height:100%;flex-direction:column}
.dash.on{display:flex}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:#120a2a;flex-wrap:wrap}
.bar h1{margin:0 8px 0 0;font-size:18px;white-space:nowrap}
.tab{font-family:inherit;font-size:14px;font-weight:800;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);cursor:pointer;white-space:nowrap}
.tab.on{background:linear-gradient(90deg,#c4b5fd,#f9a8d4);color:#160b28;border-color:transparent}
.sp{flex:1}
.mini{font-family:inherit;font-size:13px;font-weight:800;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer;white-space:nowrap;text-decoration:none}
.view{flex:1;position:relative;min-height:0}
.view iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#05040d}
.links{position:absolute;inset:0;overflow:auto;padding:18px}
.links h2{margin:0 0 4px}
.links .hint{color:var(--muted);font-size:14px;margin-bottom:14px}
.lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.lk{padding:14px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04);text-align:center}
.lk b{display:block;font-size:17px;margin-bottom:4px}
.lk small{display:block;color:var(--muted);font-size:12px;margin-bottom:10px;min-height:30px}
.lk .q{display:inline-block;padding:8px;border-radius:10px;background:#fff;line-height:0}
.lk .q img,.lk .q canvas{width:150px!important;height:150px!important}
.lk a{display:block;margin-top:8px;font-size:12px;color:#fde68a;word-break:break-all}
</style>
</head>
<body>
<div class="login" id="login">
  <form id="f" autocomplete="off">
    <h1>⚙ 관리자 화면</h1>
    <p>팀 뽑기 · 게임 진행 · 카드 뽑기 · 핀볼을<br>여기 한 곳에서 관리해요.</p>
    <input id="pw" type="password" inputmode="numeric" maxlength="20" placeholder="비밀번호" autofocus>
    <button type="submit">들어가기</button>
    <div class="err" id="err"></div>
  </form>
</div>
<div class="dash" id="dash">
  <div class="bar">
    <h1>⚙ 관리자</h1>
    <button class="tab" data-v="draw" type="button">🎲 팀 뽑기</button>
    <button class="tab" data-v="games" type="button">🎮 게임 진행</button>
    <button class="tab" data-v="lottery" type="button">🃏 카드 뽑기</button>
    <button class="tab" data-v="pinball" type="button">🎱 핀볼 추첨</button>
    <button class="tab" data-v="timetable" type="button">🗓 타임테이블</button>
    <button class="tab" data-v="links" type="button">📱 참가자 QR</button>
    <span class="sp"></span>
    <a class="mini" id="pop" href="#" target="_blank" rel="noopener">↗ 새 창(빔프로젝터용)</a>
    <button class="mini" id="out" type="button">로그아웃</button>
  </div>
  <div class="view" id="view"></div>
</div>
<script>
(()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TK='qe-admin-token';   // 같은 브라우저의 다른 화면(팀 뽑기·게임·카드·핀볼)이 이 토큰으로 관리자 모드가 된다
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const VIEWS={draw:'/',games:'/games',lottery:'/lottery',pinball:'/pinball',timetable:'/timetable'};
const LINKS=[['/','팀 뽑기','닉네임 입력 → 본명 선택 → 추첨'],['/vote','닉네임 특별상 투표','본명 → 닉네임 한 표'],['/mvp','참여왕 투표','각자 휴대폰으로 한 표'],
  ['/stay','남겠다 / 집에 가겠다','2차 인원 파악'],['/menu','2차 메뉴','이름 없이 메뉴 입력'],['/word','캐치마인드 그리는 사람','제시어 보기 · 그리기 · 정답/패스'],['/lottery','카드 뽑기','각자 휴대폰으로 카드 한 장']];
async function check(){const t=LS.get(TK);if(!t)return false;try{const j=await (await fetch('/api/admincheck?token='+encodeURIComponent(t),{cache:'no-store'})).json();return !!j.admin}catch(e){return false}}
function show(v){
  try{sessionStorage.setItem('admin-view',v)}catch(e){}
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  const box=$('#view');
  if(v==='links'){$('#pop').style.visibility='hidden';box.innerHTML='<div class="links"><h2>📱 참가자 QR</h2><div class="hint">참가자가 휴대폰으로 찍어서 들어가는 화면이에요. 이 화면들에는 관리자 기능이 없어요.</div><div class="lg" id="lg"></div></div>';drawLinks();return}
  $('#pop').style.visibility='';$('#pop').href=VIEWS[v];
  box.innerHTML=`<iframe src="${VIEWS[v]}${v==='timetable'?'?embed=1':''}" title="${v}" allow="fullscreen; autoplay"></iframe>`;
}
async function drawLinks(){
  let base=location.origin;
  try{const j=await (await fetch('/api/info',{cache:'no-store'})).json();base=(j.public||(location.hostname==='localhost'&&j.urls&&j.urls[0])||location.origin+'/').replace(/\/$/,'')}catch(e){}
  $('#lg').innerHTML=LINKS.map(([p,t,d],i)=>`<div class="lk"><b>${t}</b><small>${d}</small><div class="q" id="q${i}"></div><a href="${esc(base+p)}" target="_blank" rel="noopener">${esc(base+p)}</a></div>`).join('');
  if(!window.QRCode)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)}).catch(()=>{});
  if(window.QRCode)LINKS.forEach(([p],i)=>new QRCode($('#q'+i),{text:base+p,width:300,height:300,correctLevel:QRCode.CorrectLevel.M}));
}
function enter(){$('#login').style.display='none';$('#dash').classList.add('on');let v='games';try{v=sessionStorage.getItem('admin-view')||v}catch(e){}show(VIEWS[v]||v==='links'?v:'games')}
$('#f').addEventListener('submit',async e=>{
  e.preventDefault();$('#err').textContent='';
  try{const r=await fetch('/api/adminlogin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pw').value})});const j=await r.json().catch(()=>({}));
    if(r.ok&&j.token){LS.set(TK,j.token);enter()}else{$('#err').textContent=j.error||'비밀번호가 틀렸어요';const f=$('#f');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');$('#pw').value='';$('#pw').focus()}}
  catch(err){$('#err').textContent='서버에 연결할 수 없어요'}
});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>show(b.dataset.v)));
$('#out').addEventListener('click',()=>{LS.set(TK,null);location.reload()});
check().then(ok=>{if(ok)enter();else LS.set(TK,null)});
})();
</script>
</body>
</html>
