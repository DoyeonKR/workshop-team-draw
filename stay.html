<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>남겠다 / 집에 가겠다</title>
<style>
:root{--bg:#0b0718;--text:#f4f2ff;--muted:#aaa3cc;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1200px 600px at 50% -10%,#3b1d6e 0%,var(--bg) 60%);background-color:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;min-height:100vh;padding:18px 14px 30px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto}
h1{margin:0 0 4px;font-size:26px;font-weight:900;text-align:center;background:linear-gradient(90deg,#fde68a,#fff,#a5f3fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:12px}
.prog{text-align:center;font-size:14px;color:var(--muted);margin-bottom:14px}
.prog b{color:#fde68a}
.step{font-size:19px;font-weight:900;margin:6px 0 12px}
.step small{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{font-family:inherit}
.nm{font-size:17px;font-weight:800;padding:14px 6px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--text);cursor:pointer;touch-action:manipulation}
.nm i{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:2px}
.nm.st{border-color:rgba(74,222,128,.6)}.nm.hm{border-color:rgba(147,197,253,.6)}
.ch{display:block;width:100%;min-height:120px;border:0;border-radius:22px;font-size:30px;font-weight:900;cursor:pointer;margin-bottom:14px;touch-action:manipulation}
.ch small{display:block;font-size:14px;font-weight:700;opacity:.8;margin-top:4px}
.ch.stay{background:linear-gradient(135deg,#4ade80,#16a34a);color:#052e16}
.ch.home{background:linear-gradient(135deg,#93c5fd,#3b82f6);color:#0b1d3a}
.ch.on{outline:4px solid #fde68a;outline-offset:3px}
.ch:disabled{opacity:.5}
.back{display:inline-block;margin-top:6px;color:#a5f3fc;font-size:14px;background:none;border:0;padding:4px 0;cursor:pointer}
.done{text-align:center;padding:24px 0 10px}
.done .ic{font-size:72px}
.done .big{font-size:30px;font-weight:900;margin:10px 0 6px}
.done .bs{color:var(--muted);font-size:15px}
.alt{width:100%;min-height:52px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--text);font-size:16px;font-weight:800;cursor:pointer;margin-top:18px}
.err{min-height:20px;text-align:center;color:#fca5a5;font-weight:700;font-size:14px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🍻 남겠다 / 🏠 집에 가겠다</h1>
  <div class="sub">2차까지 남을지, 집에 갈지 한 번만 눌러 주세요</div>
  <div class="prog" id="prog">불러오는 중…</div>
  <div id="stage"></div>
  <div class="err" id="err"></div>
</div>
<script>
(()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='qe_stay_voter';
let V=null,step='who',voter=null,sending=false,lastSig='';
function mine(){try{return localStorage.getItem(KEY)}catch(e){return null}}
function setMine(v){try{v?localStorage.setItem(KEY,v):localStorage.removeItem(KEY)}catch(e){}}
const choiceOf=n=>V&&(V.names.stay.includes(n)?'stay':V.names.home.includes(n)?'home':null);
function render(){
  if(!V)return;
  $('#prog').innerHTML=`투표 <b>${V.votedCount}</b> / ${V.total}명 · 🍻 남겠다 <b>${V.counts.stay}</b> · 🏠 집 <b>${V.counts.home}</b>`;
  const me=mine();
  if(me&&!choiceOf(me)){setMine(null);if(step==='done')step='who'}   // 진행자가 초기화하면 다시 투표
  if(me&&step==='who'&&choiceOf(me)){voter=me;step='done'}
  let h;
  if(V.phase!=='open'&&step!=='done'){
    h=`<div class="done"><div class="ic">⏰</div><div class="big">투표가 마감됐어요</div><div class="bs">결과는 큰 화면에서 확인해 주세요</div></div>`;
  }else if(step==='who'){
    h=`<div class="step">1. 내 이름(본명)을 눌러 주세요<small>이미 고른 사람은 표시돼 있어요 (다시 누르면 바꿀 수 있어요)</small></div>
      <div class="grid">${V.voters.map(x=>{const c=choiceOf(x.name);return `<button class="nm${c==='stay'?' st':c==='home'?' hm':''}" data-who="${esc(x.name)}" type="button">${esc(x.name)}${c?`<i>${c==='stay'?'🍻 남겠다':'🏠 집'}</i>`:''}</button>`}).join('')}</div>`;
  }else if(step==='pick'){
    const c=choiceOf(voter);
    h=`<div class="step">2. ${esc(voter)}님, 어떻게 할래요?</div>
      <button class="ch stay${c==='stay'?' on':''}" data-ch="stay" type="button"${sending?' disabled':''}>🍻 남겠다<small>2차까지 함께!</small></button>
      <button class="ch home${c==='home'?' on':''}" data-ch="home" type="button"${sending?' disabled':''}>🏠 집에 가겠다<small>오늘은 여기까지</small></button>
      <button class="back" data-back="1" type="button">← 내 이름 다시 고르기</button>`;
  }else{
    const c=choiceOf(voter||me);
    h=`<div class="done"><div class="ic">${c==='stay'?'🍻':c==='home'?'🏠':'🗳'}</div><div class="big">${c==='stay'?'남겠다!':c==='home'?'집에 가겠다!':'투표 완료!'}</div>
      <div class="bs">${esc(voter||me||'')}님 투표 완료${V.phase!=='open'?' · 투표가 마감됐어요':''}</div>
      ${V.phase==='open'?'<button class="alt" data-change="1" type="button">마음이 바뀌었어요 (다시 고르기)</button>':''}</div>`;
  }
  if(h===lastSig)return;lastSig=h;$('#stage').innerHTML=h;
}
async function load(){
  try{const r=await fetch('/api/stay',{cache:'no-store'});V=await r.json();render()}catch(e){$('#prog').textContent='서버 연결 중…'}
}
document.addEventListener('click',async e=>{
  const w=e.target.closest('[data-who]'),c=e.target.closest('[data-ch]');
  $('#err').textContent='';
  if(w){voter=w.dataset.who;step='pick';render();scrollTo(0,0);return}
  if(e.target.closest('[data-back]')){step='who';voter=null;render();return}
  if(e.target.closest('[data-change]')){voter=voter||mine();step='pick';render();return}
  if(c&&!sending){
    sending=true;render();
    try{const r=await fetch('/api/stay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({voter,choice:c.dataset.ch})});const j=await r.json();
      if(r.ok){V=j.s;setMine(voter);step='done';if(navigator.vibrate)navigator.vibrate(120)}else $('#err').textContent=j.error||'다시 시도해 주세요'}
    catch(err){$('#err').textContent='연결이 끊겼어요. 다시 눌러 주세요'}
    sending=false;render();
  }
});
load();setInterval(load,2500);
})();
</script>
</body>
</html>
