<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>참여왕 투표</title>
<style>
:root{--bg:#0b0718;--text:#f4f2ff;--muted:#aaa3cc;--line:rgba(255,255,255,.14);--gold:#fbbf24;--tL:#fbbf24;--t1:#67e8f9;--t2:#f472b6}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1200px 600px at 50% -10%,#3b1d6e 0%,var(--bg) 60%);background-color:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;min-height:100vh;padding:18px 14px 30px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto}
h1{margin:0 0 4px;font-size:26px;font-weight:900;text-align:center;background:linear-gradient(90deg,#fde68a,#fff,#f9a8d4);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:14px}
.prog{text-align:center;font-size:13px;color:var(--muted);margin-bottom:14px}
.step{font-size:19px;font-weight:900;margin:6px 0 12px}
.step small{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
button{font-family:inherit}
.nm{font-size:17px;font-weight:800;padding:14px 6px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--text);cursor:pointer;touch-action:manipulation}
.nm:disabled{opacity:.35}
.nm i{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:2px}
.cd{text-align:left;padding:12px 12px;border-radius:16px;border:2px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);cursor:pointer;touch-action:manipulation}
.cd b{display:block;font-size:20px;font-weight:900}
.cd span{display:block;font-size:12px;color:var(--muted);margin-top:3px;word-break:keep-all}
.cd:disabled{opacity:.3}
.cd[data-t="L"]{border-color:rgba(251,191,36,.55)}.cd[data-t="1"]{border-color:rgba(103,232,249,.55)}.cd[data-t="2"]{border-color:rgba(244,114,182,.55)}
.back{display:inline-block;margin-top:14px;color:#a5f3fc;font-size:14px;background:none;border:0;padding:4px 0;cursor:pointer}
.big{font-size:36px;font-weight:900;text-align:center;margin:18px 0 6px}
.bigsub{text-align:center;color:var(--muted);font-size:15px;margin-bottom:20px}
.go{width:100%;min-height:62px;border:0;border-radius:18px;font-size:22px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,#4ade80,#16a34a);color:#052e16;margin-bottom:10px}
.go:disabled{opacity:.5}
.alt{width:100%;min-height:52px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--text);font-size:17px;font-weight:800;cursor:pointer}
.done{text-align:center;padding:30px 0}
.done .ic{font-size:72px}
.err{min-height:20px;text-align:center;color:#fca5a5;font-weight:700;font-size:14px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🙋 참여왕 투표</h1>
  <div class="sub">마지막 게임에서 <b style="color:#fde68a">참여를 제일 잘한 사람</b>에게 한 표!</div>
  <div class="prog" id="prog">불러오는 중…</div>
  <div id="stage"></div>
  <div class="err" id="err"></div>
</div>
<script>
(()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='qe_mvp_voter';
let V=null,step='who',voter=null,cand=null,sending=false,lastSig='';
const norm=s=>String(s||'').replace(/\s+/g,'').toLowerCase();
function mine(){try{return localStorage.getItem(KEY)}catch(e){return null}}
function setMine(v){try{v?localStorage.setItem(KEY,v):localStorage.removeItem(KEY)}catch(e){}}
function render(){
  if(!V)return;
  $('#prog').textContent=`투표 ${V.votedCount} / ${V.total}명`;
  const me=mine(),meVoted=me&&V.voters.some(x=>x.name===me&&x.voted);
  if(me&&!meVoted&&step==='done')step='who';           // 진행자가 투표를 초기화하면 다시 투표 가능
  if(me&&!V.voters.some(x=>x.name===me&&x.voted))setMine(null);
  let h;
  if(V.phase!=='open'){
    h=`<div class="done"><div class="ic">🏆</div><div class="big" style="font-size:26px">투표가 마감됐어요</div><div class="bigsub">결과는 큰 화면에서 발표해요!</div></div>`;
  }else if(meVoted||step==='done'){
    h=`<div class="done"><div class="ic">🗳</div><div class="big" style="font-size:28px">투표 완료!</div><div class="bigsub">${esc(me||voter||'')}님, 고마워요. 결과는 큰 화면에서 발표해요.</div></div>`;
  }else if(step==='who'){
    h=`<div class="step">1. 내 이름(본명)을 눌러 주세요<small>이미 투표한 이름은 잠겨 있어요</small></div>
      <div class="grid">${V.voters.map(x=>`<button class="nm" data-who="${esc(x.name)}" type="button"${x.voted?' disabled':''}>${esc(x.name)}${x.voted?'<i>✓ 완료</i>':''}</button>`).join('')}</div>`;
  }else if(step==='pick'){
    const myKey=norm(voter);
    h=`<div class="step">2. 참여를 제일 잘한 사람은?<small>${esc(voter)}님의 한 표 · 자기 자신은 고를 수 없어요</small></div>
      <div class="grid2">${V.candidates.map(c=>`<button class="cd" data-t="${c.team}" data-cand="${esc(c.id)}" type="button"${c.realKey===myKey?' disabled':''}><b>${esc(c.real)}</b><span>${esc(c.name)} · ${esc((V.teams||{})[c.team]||'')}</span></button>`).join('')}</div>
      <button class="back" data-back="1" type="button">← 내 이름 다시 고르기</button>`;
  }else{
    const c=V.candidates.find(x=>x.id===cand);
    h=`<div class="step" style="text-align:center">${esc(voter)}님의 한 표</div>
      <div class="big">${c?esc(c.real):'?'}</div><div class="bigsub">${c?esc(c.name)+' · '+esc((V.teams||{})[c.team]||''):''}</div>
      <button class="go" data-cast="1" type="button"${sending?' disabled':''}>✅ 투표하기</button>
      <button class="alt" data-repick="1" type="button">다시 고르기</button>`;
  }
  const sig=h;if(sig===lastSig)return;lastSig=sig;$('#stage').innerHTML=h;
}
async function load(){
  try{const r=await fetch('/api/mvp',{cache:'no-store'});V=await r.json();render()}catch(e){$('#prog').textContent='서버 연결 중…'}
}
document.addEventListener('click',async e=>{
  const w=e.target.closest('[data-who]'),c=e.target.closest('[data-cand]');
  $('#err').textContent='';
  if(w&&!w.disabled){voter=w.dataset.who;step='pick';render();scrollTo(0,0);return}
  if(c&&!c.disabled){cand=c.dataset.cand;step='confirm';render();scrollTo(0,0);return}
  if(e.target.closest('[data-back]')){step='who';voter=null;render();return}
  if(e.target.closest('[data-repick]')){step='pick';cand=null;render();return}
  if(e.target.closest('[data-cast]')&&!sending){
    sending=true;render();
    try{const r=await fetch('/api/mvp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({voter,cand})});const j=await r.json();
      if(r.ok){setMine(voter);step='done';if(navigator.vibrate)navigator.vibrate(120)}else{$('#err').textContent=j.error||'다시 시도해 주세요';if(/이미/.test(j.error||''))step='who'}}
    catch(err){$('#err').textContent='연결이 끊겼어요. 다시 눌러 주세요'}
    sending=false;await load();render();
  }
});
load();setInterval(load,2500);
})();
</script>
</body>
</html>
