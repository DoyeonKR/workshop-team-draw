<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026 QE팀 합동 워크샾 · 타임테이블</title>
<style>
:root{--bg:#05040d;--text:#f6f4ff;--muted:#b9b2df;--line:rgba(255,255,255,.14);
  --c-move:#a78bfa;--c-photo:#f9a8d4;--c-game:#22d3ee;--c-food:#fb923c;--c-night:#f472b6;--c-end:#fbbf24;--cL:#fbbf24;--c1:#22d3ee;--c2:#f472b6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased;cursor:default}
body.idle{cursor:none}
/* 배경: 오로라 + 별 + 반짝이 */
.aurora{position:fixed;inset:-25%;z-index:0;filter:blur(60px);opacity:.75;
  background:radial-gradient(35% 30% at 20% 25%,rgba(34,211,238,.45),transparent 70%),radial-gradient(35% 35% at 80% 20%,rgba(244,114,182,.42),transparent 70%),
  radial-gradient(40% 35% at 55% 85%,rgba(251,191,36,.30),transparent 70%),radial-gradient(30% 30% at 10% 85%,rgba(167,139,250,.38),transparent 70%);
  animation:aur 24s ease-in-out infinite alternate}
@keyframes aur{50%{transform:translate(4%,-3%) rotate(8deg) scale(1.1)}100%{transform:translate(-3%,3%) rotate(-6deg) scale(1.05)}}
#sky,#fx{position:fixed;inset:0;z-index:1;pointer-events:none}
#fx{z-index:6}
.page{position:relative;z-index:2;height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:1.6vh;padding:2.4vh 2.6vw 1.6vh}
/* 머리 */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2vw;align-items:start}
.badge{display:inline-flex;align-items:center;gap:.6em;padding:.45em 1.1em;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.07);font-size:clamp(13px,1.45vh,20px);font-weight:800;color:#fde68a;letter-spacing:.06em}
.title{margin:.25em 0 .1em;font-size:clamp(40px,8.2vh,124px);font-weight:900;line-height:1.02;letter-spacing:-.02em;
  background:linear-gradient(100deg,#67e8f9 0%,#ffffff 18%,#f9a8d4 36%,#fde68a 54%,#c4b5fd 72%,#67e8f9 100%);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite;filter:drop-shadow(0 0 30px rgba(244,114,182,.35))}
.title{animation:shine 7s linear infinite,float 4s ease-in-out infinite}
@keyframes shine{to{background-position:300% 0}}
@keyframes float{50%{transform:translateY(-.08em)}}
.thanks{min-height:2.6em;font-size:clamp(18px,2.8vh,40px);font-weight:800;color:#fff;line-height:1.3}
.thanks span{display:inline-block;animation:msgin .9s cubic-bezier(.2,1.2,.4,1) both}
.thanks b{background:linear-gradient(90deg,#fde68a,#f9a8d4);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes msgin{from{opacity:0;transform:translateY(.6em) scale(.96);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.clockbox{text-align:right;padding:1.4vh 1.4vw;border-radius:22px;border:1px solid var(--line);background:rgba(10,6,30,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);min-width:24vw}
.clock{font-size:clamp(34px,6.6vh,96px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:.02em}
.clock small{font-size:.42em;color:var(--muted);margin-left:.15em}
.dday{font-size:clamp(14px,1.8vh,24px);font-weight:800;color:#a5f3fc;margin-top:.6vh}
.nowline{margin-top:1vh;font-size:clamp(14px,1.9vh,26px);font-weight:800;line-height:1.45}
.nowline .tag{display:inline-block;padding:.1em .6em;border-radius:999px;background:linear-gradient(90deg,#f472b6,#fbbf24);color:#2b0b1d;font-size:.8em;margin-right:.4em;animation:pulse 1.4s ease-in-out infinite}
.nowline .cd{color:#fde68a;font-variant-numeric:tabular-nums}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 18px rgba(251,191,36,.6)}}
/* 타임라인 */
.tl{position:relative;display:grid;grid-template-columns:1fr .8fr 2.15fr 1.15fr 1.15fr .95fr;gap:1.1vw;align-items:stretch;min-height:0}
.tl::before{content:"";position:absolute;left:0;right:0;top:4.3vh;height:4px;border-radius:4px;z-index:0;
  background:linear-gradient(90deg,var(--c-move),var(--c-photo),var(--c-game),var(--c-food),var(--c-night),var(--c-end));box-shadow:0 0 18px rgba(255,255,255,.25)}
.slot{position:relative;z-index:1;display:flex;flex-direction:column;min-height:0}
.slot .tm{height:8.6vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:.5vh}
.slot .dot{width:2.2vh;height:2.2vh;border-radius:50%;background:var(--k);box-shadow:0 0 0 .5vh var(--bg),0 0 2vh var(--k);margin-top:3.2vh}
.slot .tt{font-size:clamp(15px,2.4vh,34px);font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.01em;margin-top:.3vh}
.slot .tt small{font-size:.62em;color:var(--muted);font-weight:700}
.card{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:24px;padding:2vh 1.1vw;border:1px solid var(--line);
  background:linear-gradient(170deg,rgba(255,255,255,.10),rgba(255,255,255,.03));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;flex-direction:column;gap:1.1vh;transition:transform .4s,box-shadow .4s,opacity .4s}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--k)}
.card .ic{font-size:clamp(34px,6.4vh,92px);line-height:1;filter:drop-shadow(0 0 1.4vh var(--k))}
.card h3{margin:0;font-size:clamp(17px,2.9vh,42px);font-weight:900;line-height:1.15;word-break:keep-all}
.card p{margin:0;font-size:clamp(13px,1.85vh,26px);color:#e8e4ff;line-height:1.45;word-break:keep-all}
.slot[data-k="move"]{--k:var(--c-move)}.slot[data-k="photo"]{--k:var(--c-photo)}.slot[data-k="game"]{--k:var(--c-game)}
.slot[data-k="food"]{--k:var(--c-food)}.slot[data-k="night"]{--k:var(--c-night)}.slot[data-k="end"]{--k:var(--c-end)}
.slot.now .card{box-shadow:0 0 0 3px var(--k),0 0 6vh color-mix(in srgb,var(--k) 55%,transparent);background:linear-gradient(170deg,rgba(255,255,255,.18),rgba(255,255,255,.05))}
.slot.now .dot{animation:ping 1.3s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 .5vh var(--bg),0 0 0 .5vh var(--k)}100%{box-shadow:0 0 0 .5vh var(--bg),0 0 0 3vh transparent}}
.slot.now .card .live{display:inline-flex}
.live{display:none;align-self:flex-start;align-items:center;gap:.4em;padding:.25em .8em;border-radius:999px;font-size:clamp(11px,1.5vh,20px);font-weight:900;background:var(--k);color:#14091f}
.live::before{content:"";width:.6em;height:.6em;border-radius:50%;background:#14091f;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.slot.past .card{opacity:.42;filter:saturate(.6)}
.prog{height:.8vh;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;display:none}
.prog i{display:block;height:100%;background:var(--k);border-radius:99px}
.slot.now .prog{display:block}
/* 게임 카드 속 순서 */
.seq{display:flex;flex-wrap:wrap;align-items:center;gap:.6vh .5vw}
.chip{padding:.55vh .8vw;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.3);font-size:clamp(13px,1.95vh,28px);font-weight:900;white-space:nowrap}
.chip.brk{background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.55);color:#fde68a;font-weight:800}
.arrow{color:var(--muted);font-weight:900;font-size:clamp(12px,1.8vh,24px)}
.prize{display:flex;flex-wrap:wrap;gap:.6vh .5vw;margin-top:auto;padding-top:1vh;border-top:1px dashed var(--line)}
.prize span{font-size:clamp(12px,1.75vh,24px);font-weight:800;padding:.4vh .7vw;border-radius:12px;background:rgba(0,0,0,.28)}
.prize b{margin-right:.35em}
/* 아래: 팀 + 감사 자막 */
.bottom{display:grid;grid-template-columns:repeat(3,1fr);gap:1.1vw}
.team{border-radius:18px;padding:1.1vh 1vw;border:1px solid var(--line);border-left:5px solid var(--k);background:rgba(10,6,30,.45);min-width:0}
.team[data-t="L"]{--k:var(--cL)}.team[data-t="1"]{--k:var(--c1)}.team[data-t="2"]{--k:var(--c2)}
.team b{font-size:clamp(15px,2.3vh,32px);color:var(--k);font-weight:900}
.team small{color:var(--muted);font-weight:700;margin-left:.4em;font-size:clamp(11px,1.5vh,20px)}
.team .mem{font-size:clamp(11px,1.6vh,22px);color:#e8e4ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.3vh}
.ticker{grid-column:1/-1;overflow:hidden;white-space:nowrap;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);padding:.7vh 0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.ticker .run{display:inline-block;padding-left:100%;animation:tick 48s linear infinite;font-size:clamp(14px,2vh,28px);font-weight:800;color:#fde68a}
.ticker .run span{margin:0 2.2vw;color:#fff}
@keyframes tick{to{transform:translateX(-100%)}}
/* 조작 버튼 (마우스를 움직이면 보임) */
.ctrl{position:fixed;right:1.6vw;bottom:2vh;z-index:20;display:flex;gap:8px;opacity:1;transition:opacity .5s}
body.idle .ctrl{opacity:0;pointer-events:none}
.ctrl button{font-family:inherit;font-size:15px;font-weight:800;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(10,6,30,.75);color:#fff;cursor:pointer}
.ctrl button:hover{background:rgba(255,255,255,.18)}
/* 휴식 타이머 */
.rightbox{display:flex;gap:1vw;align-items:stretch}
#brk{display:none;flex-direction:column;justify-content:center;gap:.7vh;padding:1.3vh 1.3vw;border-radius:22px;min-width:19vw;text-align:center;cursor:pointer;
  border:1px solid rgba(251,191,36,.65);background:linear-gradient(160deg,rgba(251,191,36,.20),rgba(244,114,182,.14),rgba(10,6,30,.55));
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:brkglow 2.4s ease-in-out infinite}
#brk.show{display:flex;animation:brkin .7s cubic-bezier(.2,1.6,.4,1),brkglow 2.4s ease-in-out .7s infinite}
@keyframes brkin{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes brkglow{0%,100%{box-shadow:0 0 0 1px rgba(251,191,36,.4),0 0 2.6vh rgba(251,191,36,.35)}50%{box-shadow:0 0 0 1px rgba(249,168,212,.6),0 0 5vh rgba(249,168,212,.55)}}
#brk .bt1{font-size:clamp(15px,2.3vh,32px);font-weight:900;color:#fde68a}
#brk .bt1 .cup{display:inline-block;animation:float 2.4s ease-in-out infinite}
#brk .bt2{font-size:clamp(40px,7.4vh,108px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1;
  background:linear-gradient(100deg,#67e8f9,#fff,#f9a8d4,#fde68a);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
#brk .bbar{height:.9vh;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
#brk .bbar i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#f472b6,#fbbf24);border-radius:99px;transition:width 1s linear}
#brk .bt3{font-size:clamp(11px,1.6vh,22px);color:#e8e4ff;font-weight:800}
#brk.done{border-color:#86efac;background:linear-gradient(160deg,rgba(134,239,172,.25),rgba(103,232,249,.18),rgba(10,6,30,.55))}
#brk.done .bt2{animation:shine 6s linear infinite,pulse 1s ease-in-out infinite;font-size:clamp(26px,4.6vh,66px)}
@media (max-aspect-ratio:4/3){.tl{grid-template-columns:repeat(3,1fr);grid-auto-rows:minmax(0,1fr)}.tl::before{display:none}.slot .tm{height:auto;flex-direction:row;gap:.6em}.slot .dot{margin-top:0}
  .slot[data-k="game"]{grid-column:span 2}.bottom{grid-template-columns:1fr}.team:nth-child(n+2){display:none}.clockbox{min-width:0}}
/* 파트너사 감사 */
.badges{display:flex;flex-wrap:wrap;gap:.8vw;align-items:center}
.badge.partners{position:relative;overflow:hidden;color:#fff;border-color:transparent;
  background:linear-gradient(90deg,rgba(103,232,249,.28),rgba(249,168,212,.28),rgba(253,230,138,.28));box-shadow:0 0 0 1px rgba(255,255,255,.25),0 0 2.4vh rgba(249,168,212,.45);animation:pglow 3s ease-in-out infinite}
.badge.partners b{font-weight:900;letter-spacing:.04em;background:linear-gradient(90deg,#67e8f9,#fff,#fde68a,#f9a8d4,#67e8f9);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
.badge.partners i{font-style:normal;color:#fde68a;margin:0 .1em}
.badge.partners .pin{display:inline-block;animation:msgin .7s cubic-bezier(.2,1.2,.4,1) both}
.badge.partners::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);background-size:260% 100%;animation:sweep 3.2s ease-in-out infinite;pointer-events:none}
@keyframes pglow{50%{box-shadow:0 0 0 1px rgba(255,255,255,.4),0 0 4vh rgba(253,230,138,.6)}}
#thanksSpot{position:fixed;inset:0;z-index:11;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2.6vh;text-align:center;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(20,8,48,.86),rgba(5,4,13,.55) 70%,rgba(5,4,13,.2))}
#thanksSpot.show{display:flex;animation:fadein .6s ease-out}
#thanksSpot .k1{font-size:clamp(20px,3.4vh,48px);font-weight:900;letter-spacing:.5em;color:#fde68a;animation:slamin .8s cubic-bezier(.2,1.8,.4,1) both}
#thanksSpot .names{display:flex;align-items:center;gap:4vw;flex-wrap:wrap;justify-content:center}
#thanksSpot .nm{font-size:clamp(56px,13vh,190px);font-weight:900;letter-spacing:.02em;line-height:1;
  background:linear-gradient(100deg,#67e8f9,#ffffff,#f9a8d4,#fde68a,#c4b5fd,#67e8f9);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 3.5vh rgba(249,168,212,.65));animation:slamin .9s cubic-bezier(.2,1.8,.4,1) both,shine 4s linear infinite}
#thanksSpot .nm:nth-of-type(3){animation-delay:.25s,0s}
#thanksSpot .amp{font-size:clamp(40px,8vh,110px);color:#fde68a;font-weight:900;animation:slamin .8s cubic-bezier(.2,1.8,.4,1) .12s both,float 2.4s ease-in-out infinite}
#thanksSpot .k2{font-size:clamp(20px,3.6vh,52px);font-weight:900;color:#fff;animation:slamin .8s cubic-bezier(.2,1.8,.4,1) .45s both}
#thanksSpot .k3{font-size:clamp(14px,2.2vh,30px);font-weight:700;color:#e8e4ff;animation:slamin .8s cubic-bezier(.2,1.8,.4,1) .6s both}
#thanksSpot .names.ppl{gap:3vw}
#thanksSpot .names.ppl .nm{font-size:clamp(48px,11vh,160px)}
#thanksSpot .names.ppl .nm:nth-of-type(3){animation-delay:.2s,0s}
#thanksSpot .names.ppl .nm:nth-of-type(5){animation-delay:.4s,0s}
#thanksSpot .dotsep{font-size:clamp(30px,6vh,80px);color:#fde68a;font-weight:900;animation:slamin .8s cubic-bezier(.2,1.8,.4,1) .1s both,float 2.4s ease-in-out infinite}
@keyframes fadein{from{opacity:0}to{opacity:1}}
/* ===== 진행 중 카드: 번쩍번쩍 하이라이트 ===== */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
.card .rim,.card .sweep{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .6s}
.card .rim{padding:4px;background:conic-gradient(from var(--ang),#67e8f9,#f9a8d4,#fde68a,#86efac,#c4b5fd,#67e8f9);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  animation:rimspin 2.6s linear infinite}
.card .sweep{background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 46%,rgba(255,255,255,.55) 50%,rgba(255,255,255,.28) 54%,transparent 70%);
  background-size:260% 100%;animation:sweep 2.8s ease-in-out infinite}
@keyframes rimspin{to{--ang:360deg}}
@keyframes sweep{0%{background-position:130% 0}60%,100%{background-position:-130% 0}}
.slot.now .card .rim,.slot.now .card .sweep{opacity:1}
.slot.now .card{animation:glow 2.4s ease-in-out infinite;z-index:3}
@keyframes glow{0%,100%{box-shadow:0 0 0 2px var(--k),0 0 3vh var(--k),0 0 9vh rgba(244,114,182,.35)}
  33%{box-shadow:0 0 0 2px #fde68a,0 0 5vh #fde68a,0 0 13vh rgba(103,232,249,.45)}
  66%{box-shadow:0 0 0 2px #f9a8d4,0 0 6vh #f9a8d4,0 0 15vh rgba(196,181,253,.5)}}
.slot.now .card .ic{animation:bounce 1.1s cubic-bezier(.3,1.6,.5,1) infinite}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-1.4vh) rotate(-8deg) scale(1.12)}70%{transform:translateY(0) rotate(5deg)}}
.slot.now .card h3{background:linear-gradient(90deg,#fff,#fde68a,#f9a8d4,#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3s linear infinite}
.slot.now .tt{color:#fde68a;text-shadow:0 0 1.6vh #fde68a}
/* 그 시간이 되는 순간 */
.slot.enter .card{animation:enterpop 1.4s cubic-bezier(.2,1.6,.4,1),glow 2.4s ease-in-out 1.4s infinite}
@keyframes enterpop{0%{transform:scale(1)}15%{transform:scale(1.14) rotate(-1.5deg)}30%{transform:scale(.96) rotate(1.5deg)}45%{transform:scale(1.07) rotate(-1deg)}60%{transform:scale(.99)}100%{transform:scale(1)}}
.slot .flash{position:absolute;inset:0;border-radius:24px;background:#fff;opacity:0;pointer-events:none;z-index:4}
.slot.enter .flash{animation:cflash 1.2s ease-out 3}
@keyframes cflash{0%{opacity:.9}100%{opacity:0}}
#screenflash{position:fixed;inset:0;z-index:12;background:radial-gradient(circle,#fff,rgba(255,255,255,.6) 40%,transparent 75%);opacity:0;pointer-events:none}
#screenflash.go{animation:sflash 1.1s ease-out}
@keyframes sflash{0%{opacity:.95}100%{opacity:0}}
#announce{position:fixed;inset:0;z-index:13;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2vh;text-align:center;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(20,8,48,.72),rgba(5,4,13,.25) 70%,transparent)}
#announce.show{display:flex}
#announce .ai{font-size:clamp(80px,18vh,240px);line-height:1;animation:slamin .8s cubic-bezier(.2,1.8,.4,1) both,bounce 1.1s cubic-bezier(.3,1.6,.5,1) .8s infinite}
#announce .at{font-size:clamp(40px,9vh,130px);font-weight:900;line-height:1.05;animation:slamin .8s cubic-bezier(.2,1.8,.4,1) .12s both;
  background:linear-gradient(100deg,#67e8f9,#fff,#f9a8d4,#fde68a,#67e8f9);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 3vh rgba(244,114,182,.6))}
#announce .as{font-size:clamp(20px,3.6vh,52px);font-weight:900;color:#fde68a;animation:slamin .8s cubic-bezier(.2,1.8,.4,1) .25s both}
@keyframes slamin{0%{transform:scale(3.2);opacity:0;filter:blur(10px)}60%{transform:scale(.92);opacity:1;filter:none}100%{transform:scale(1)}}
/* 게임 카드는 내용이 많아 조금 촘촘하게 */
.slot[data-k="game"] .card{gap:.8vh;padding:1.6vh 1vw}
.slot[data-k="game"] .card .ic{font-size:clamp(28px,5vh,72px)}
.slot[data-k="game"] .chip{font-size:clamp(12px,1.75vh,26px);padding:.45vh .7vw}
.slot[data-k="game"] .card p{font-size:clamp(12px,1.65vh,24px)}
.slot[data-k="game"] .prize{padding-top:.7vh;gap:.5vh .4vw}
.slot[data-k="game"] .prize span{font-size:clamp(11px,1.6vh,22px);padding:.3vh .55vw}
@media (prefers-reduced-motion:reduce){.aurora,.title,.ticker .run{animation:none}}
</style>
</head>
<body>
<div class="aurora"></div>
<canvas id="sky"></canvas>
<canvas id="fx"></canvas>
<div class="page">
  <div class="top">
    <div>

(()=>{const c=$('#sky'),x=c.getContext('2d');let W,H,st=[],sp=[];
  function rs(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);
    st=Array.from({length:Math.min(320,(W*H/5000)|0)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.2,p:Math.random()*6.28,s:.008+Math.random()*.03}));
    sp=Array.from({length:46},()=>mk(true))}
  function mk(init){const cols=['#67e8f9','#f9a8d4','#fde68a','#c4b5fd','#ffffff'];return{x:Math.random()*W,y:init?Math.random()*H:H+20,v:.25+Math.random()*.7,r:1.5+Math.random()*3.5,c:cols[(Math.random()*cols.length)|0],w:Math.random()*6.28}}
  rs();addEventListener('resize',rs);
  (function f(){x.clearRect(0,0,W,H);
    for(const s of st){s.p+=s.s;x.globalAlpha=.2+.8*Math.abs(Math.sin(s.p));x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);x.fill()}
    for(let i=0;i<sp.length;i++){const p=sp[i];p.y-=p.v;p.w+=.03;p.x+=Math.sin(p.w)*.4;if(p.y<-20)sp[i]=mk(false);
      x.globalAlpha=.75;x.fillStyle=p.c;x.shadowColor=p.c;x.shadowBlur=12;x.beginPath();x.arc(p.x,p.y,p.r,0,6.28);x.fill();x.shadowBlur=0}
    x.globalAlpha=1;requestAnimationFrame(f)})();
})();

// 불꽃놀이 (가끔 · 순서가 바뀔 때)
const fx=(()=>{const c=$('#fx'),x=c.getContext('2d');let W,H,ps=[],rk=[],raf=0;const R=Math.random;
  function rs(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}rs();addEventListener('resize',rs);
  const cols=[['#67e8f9','#3b82f6','#fff'],['#f9a8d4','#a855f7','#fff'],['#fde68a','#f59e0b','#fff'],['#86efac','#22c55e','#fff']];
  function burst(px,py,cs){for(let i=0;i<110;i++){const a=R()*6.283,s=2+R()*6.5;ps.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,d:.009+R()*.012,c:cs[(R()*cs.length)|0]})}kick()}
  function rocket(){rk.push({x:W*(.1+R()*.8),y:H+10,vy:-Math.sqrt(2*.12*H*(.55+R()*.3)),ty:H*(.12+R()*.3),cs:cols[(R()*cols.length)|0]});kick()}
  function kick(){if(!raf)raf=requestAnimationFrame(loop)}
  function loop(){raf=0;x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';
    for(let i=rk.length-1;i>=0;i--){const r=rk[i];r.y+=r.vy;r.vy+=.12;x.fillStyle='#fff';x.globalAlpha=1;x.beginPath();x.arc(r.x,r.y,2.4,0,6.28);x.fill();
      if(r.y<=r.ty||r.vy>=-1){rk.splice(i,1);burst(r.x,r.y,r.cs)}}
    for(let i=ps.length-1;i>=0;i--){const p=ps[i];p.vx*=.982;p.vy=p.vy*.982+.06;p.x+=p.vx;p.y+=p.vy;p.l-=p.d;if(p.l<=0){ps.splice(i,1);continue}
      x.globalAlpha=Math.min(1,p.l*1.3);x.strokeStyle=p.c;x.lineWidth=2;x.beginPath();x.moveTo(p.x-p.vx*2.2,p.y-p.vy*2.2);x.lineTo(p.x,p.y);x.stroke()}
    x.globalAlpha=1;x.globalCompositeOperation='source-over';if(ps.length||rk.length)kick()}
  function sparkAt(px,py){const cs=cols[(R()*cols.length)|0];for(let i=0;i<26;i++){const a=R()*6.283,s=.8+R()*2.6;ps.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,d:.02+R()*.02,c:cs[(R()*cs.length)|0]})}kick()}
  return{rocket,show(n){for(let i=0;i<n;i++)setTimeout(rocket,i*260)},burstAt(px,py){burst(px,py,cols[(R()*cols.length)|0])},sparkAt}})();

function startBreak(min){
  brkEnd=Date.now()+min*60000;$('#brk').classList.remove('done');$('#brk').classList.add('show');
  $('#brk').innerHTML=`<div class="bt1"><span class="cup">☕</span> 쉬는 시간</div><div class="bt2" id="bTime"></div><div class="bbar"><i id="bBar"></i></div>
    <div class="bt3">물 한 잔 마시고 다음 게임 준비! 🎮</div>`;
  clearInterval(brkT);const total=min*60000;
  const upd=()=>{const left=brkEnd-Date.now();
    if(left<=0){clearInterval(brkT);$('#bTime').textContent='0:00';$('#bBar').style.width='0%';$('#brk').classList.add('done');
      $('#brk .bt1').textContent='⏰ 휴식 끝!';$('#bTime').textContent='🎮 게임 시작!';$('#brk .bt3').textContent='모두 자리로 모여 주세요!';fx.show(10);
      const r=$('#brk').getBoundingClientRect();for(let k=0;k<5;k++)setTimeout(()=>fx.burstAt(r.left+Math.random()*r.width,r.top+Math.random()*r.height),k*240);
      clearTimeout(stopBreak.h);stopBreak.h=setTimeout(stopBreak,30000);return}
    const s=Math.ceil(left/1000);$('#bTime').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;$('#bBar').style.width=(100*left/total)+'%'};
  upd();brkT=setInterval(upd,250);clearTimeout(stopBreak.h);
  setTimeout(()=>{const r=$('#brk').getBoundingClientRect();for(let k=0;k<3;k++)setTimeout(()=>fx.burstAt(r.left+Math.random()*r.width,r.top+Math.random()*r.height),k*200)},300);
}
function stopBreak(){clearInterval(brkT);clearTimeout(stopBreak.h);$('#brk').classList.remove('show','done')}
$('#brk').addEventListener('dblclick',stopBreak);
$('#bBreak').addEventListener('click',()=>startBreak(15));

// 전체화면 · 닫기
function toggleFs(){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else document.documentElement.requestFullscreen().catch(()=>{})}
function closeMe(){if(EMBED)parent.postMessage({type:'tt-close'},'*');else if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else history.length>1?history.back():(location.href='/')}
$('#bFs').addEventListener('click',toggleFs);
$('#bClose').addEventListener('click',closeMe);
if(EMBED)$('#bFs').style.display='none';
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#brk').classList.contains('show')){stopBreak();return}closeMe()}
  else if(e.key==='b'||e.key==='B'||e.key==='ㅠ'){$('#brk').classList.contains('show')?stopBreak():startBreak(15)}
  else if((e.key==='f'||e.key==='F'||e.key==='ㄹ')&&!EMBED)toggleFs();
  else if(e.key==='t'||e.key==='T'||e.key==='ㅅ')partnerSpot();
});
// 마우스를 안 움직이면 버튼·커서 숨김
let idleT=null;function wake(){document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>document.body.classList.add('idle'),3000)}
['mousemove','pointerdown','keydown'].forEach(n=>addEventListener(n,wake));wake();
})();
</script>
